{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: {{ .Release.Name }}, labels: { release: monitoring } }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: releasepilot } }
  endpoints: [{ port: http, path: /metrics, interval: 30s }]
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: {{ .Release.Name }}-ingress }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: releasepilot } }
  policyTypes: [Ingress]
  ingress: [{ ports: [{ protocol: TCP, port: 3000 }] }]
