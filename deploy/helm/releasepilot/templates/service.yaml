apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels: { app.kubernetes.io/name: releasepilot }
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector: { app.kubernetes.io/name: releasepilot }
  ports: [{ name: http, port: {{ .Values.service.port }}, targetPort: http }]
